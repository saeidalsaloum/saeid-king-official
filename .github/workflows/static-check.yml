name: Static website checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import re
          import sys
          import xml.etree.ElementTree as ET

          root = Path('.')
          required_files = {
              'index.html',
              'en.html',
              'media-kit.html',
              'privacy.html',
              '404.html',
              'robots.txt',
              'sitemap.xml',
              'README.md',
              'AGENTS.md',
              'assets/css/styles.css',
              'assets/img/saeid-king-mark.svg',
              'docs/CONTENT_STRATEGY.md',
              'docs/YOUTUBE_CHANNEL_PROFILE.md',
              '.github/workflows/static-check.yml',
          }
          for file in sorted(required_files):
              if not (root / file).is_file():
                  raise SystemExit(f'Missing required file: {file}')

          forbidden_files = {
              'test.txt',
              'kit.html',
              'entity-test.html',
              'minimal.html',
              'arabic-test.html',
              'README-PLAN.md',
          }
          for file in sorted(forbidden_files):
              if (root / file).exists():
                  raise SystemExit(f'Forbidden file present: {file}')

          tracked_files = [p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts]
          temp_pattern = re.compile(r'(scratch|probe|tmp|temp)', re.I)
          offenders = [str(p) for p in tracked_files if temp_pattern.search(str(p))]
          if offenders:
              raise SystemExit(f'Temporary file detected: {offenders}')

          old_email = 'saeidwebbservice' + '@gmail.com'
          bad_brand = '\u0633\u0639\u064a\u062f KING'
          tracking_pattern = re.compile(r'googletagmanager|google-analytics|gtag\(|facebook\.net|hotjar|matomo|plausible|clarity\.ms|document\.cookie|localStorage|sessionStorage', re.I)
          sensitive_pattern = re.compile(r'personnummer|password|api_key|private_key|bankid|href=["\']tel:|\btel:', re.I)
          remote_asset_pattern = re.compile(r'<(?:script|img|iframe|source|video|audio|link)\b[^>]*(?:src|href)=["\'](?:https?:)?//', re.I)
          form_pattern = re.compile(r'<\s*form\b', re.I)
          fake_claim_pattern = re.compile(r'\b(\d+[kKmM]?\+?\s*(subscribers|views|followers)|official sponsor|trusted by|featured in)\b', re.I)

          public_paths = [p for p in tracked_files if p.suffix.lower() in {'.html', '.css', '.md', '.xml', '.txt'}]
          for path in public_paths:
              text = path.read_text(encoding='utf-8')
              if old_email in text:
                  raise SystemExit(f'Old email found: {path}')
              if bad_brand in text:
                  raise SystemExit(f'Non-canonical Arabic-script brand spelling found: {path}')
              if tracking_pattern.search(text):
                  raise SystemExit(f'Tracking, storage, or cookie marker found: {path}')
              if sensitive_pattern.search(text):
                  raise SystemExit(f'Sensitive or phone marker found: {path}')
              if form_pattern.search(text):
                  raise SystemExit(f'Form found: {path}')
              if fake_claim_pattern.search(text):
                  raise SystemExit(f'Potential fake public claim found: {path}')
              if path.suffix.lower() == '.html' and remote_asset_pattern.search(text):
                  raise SystemExit(f'Remote asset or embed found: {path}')

          robots = Path('robots.txt').read_text(encoding='utf-8')
          sitemap_url = 'https://saeidalsaloum.github.io/saeid-king-official/sitemap.xml'
          if robots.count(sitemap_url) != 1:
              raise SystemExit('robots.txt must reference the sitemap exactly once')

          expected_sitemap = {
              'https://saeidalsaloum.github.io/saeid-king-official/',
              'https://saeidalsaloum.github.io/saeid-king-official/index.html',
              'https://saeidalsaloum.github.io/saeid-king-official/en.html',
              'https://saeidalsaloum.github.io/saeid-king-official/media-kit.html',
              'https://saeidalsaloum.github.io/saeid-king-official/privacy.html',
              'https://saeidalsaloum.github.io/saeid-king-official/404.html',
          }
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs = {node.text for node in ET.parse('sitemap.xml').findall('.//sm:loc', ns)}
          if locs != expected_sitemap:
              raise SystemExit(f'Invalid sitemap entries: {sorted(locs)}')

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.html_attrs = {}
                  self.links = []
                  self.srcs = []
                  self.anchors = set()
                  self.viewport = False
                  self.stylesheet = False
                  self.remote_assets = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'html':
                      self.html_attrs = attrs
                  if 'id' in attrs:
                      self.anchors.add(attrs['id'])
                  if tag == 'a' and 'href' in attrs:
                      self.links.append(attrs['href'])
                  if tag in {'img', 'script', 'source', 'video', 'audio', 'iframe'} and 'src' in attrs:
                      self.srcs.append(attrs['src'])
                  if tag == 'meta' and attrs.get('name') == 'viewport':
                      self.viewport = True
                  if tag == 'link' and attrs.get('rel') == 'stylesheet':
                      self.stylesheet = attrs.get('href', '') == 'assets/css/styles.css'
                  if tag in {'img', 'script', 'source', 'video', 'audio', 'iframe'}:
                      value = attrs.get('src', '')
                      if value.startswith(('http://', 'https://', '//')):
                          self.remote_assets.append(value)

          html_files = sorted(root.glob('*.html'))
          expected_html = {'index.html', 'en.html', 'media-kit.html', 'privacy.html', '404.html'}
          found_html = {p.name for p in html_files}
          if expected_html != found_html:
              raise SystemExit(f'Unexpected HTML pages: {sorted(found_html)}')

          for path in html_files:
              parser = Parser()
              text = path.read_text(encoding='utf-8')
              parser.feed(text)

              lang = parser.html_attrs.get('lang')
              direction = parser.html_attrs.get('dir')
              if path.name == 'en.html':
                  assert lang == 'en' and direction == 'ltr', f'{path}: en.html must be lang=en dir=ltr'
              else:
                  assert lang == 'ar' and direction == 'rtl', f'{path}: Arabic pages must be lang=ar dir=rtl'

              assert parser.viewport, f'{path}: missing viewport meta'
              assert parser.stylesheet, f'{path}: missing assets/css/styles.css reference'
              assert not parser.remote_assets, f'{path}: remote asset found {parser.remote_assets}'

              if path.name == 'en.html':
                  assert re.search(r'<a[^>]+href=["\']index\.html["\'][^>]*>\s*العربية\s*</a>', text), f'{path}: missing العربية link to index.html'
              else:
                  assert re.search(r'<a[^>]+href=["\']en\.html["\'][^>]*>\s*English\s*</a>', text), f'{path}: missing English link to en.html'

              refs = parser.links + parser.srcs
              for ref in refs:
                  if ref.startswith('mailto:'):
                      assert ref == 'mailto:saeidkingofficial@gmail.com', f'{path}: unexpected mailto {ref}'
                      continue
                  if ref.startswith('#'):
                      if ref[1:] and ref[1:] not in parser.anchors:
                          raise AssertionError(f'{path}: broken anchor {ref}')
                      continue
                  parsed = urlparse(ref)
                  if parsed.scheme or parsed.netloc:
                      raise AssertionError(f'{path}: remote href/src not allowed {ref}')
                  target_part = unquote(parsed.path)
                  if not target_part:
                      continue
                  target = (path.parent / target_part).resolve()
                  try:
                      target.relative_to(root.resolve())
                  except ValueError:
                      raise AssertionError(f'{path}: reference leaves repository root: {ref}')
                  if not target.exists():
                      raise AssertionError(f'{path}: missing local reference {ref}')
                  if parsed.fragment and target.suffix == '.html':
                      other = Parser()
                      other.feed(target.read_text(encoding='utf-8'))
                      if parsed.fragment not in other.anchors:
                          raise AssertionError(f'{path}: missing anchor {ref}')

          print('Static checks passed.')
          PY
